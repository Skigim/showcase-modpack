#:schema https://docs.rsmm.me/manifest.schema.json
[mod]
id                = "WikiZoom"
name              = "Wiki Zoom"
version           = "1.0.0"
author            = "Skigim"
summary           = "Sets the camera distance from a config number, live."
description       = "Pulls the gameplay camera back (or in) to the distance in config.toml, and follows edits while the game runs. 0 hands the camera back to the game. Camera only, so it counts as client-only online."
license           = "MIT"
repo_url          = "https://github.com/Skigim/showcase-modpack"
tags              = ["camera", "showcase", "wiki"]
enabled           = true
multiplayer_scope = "cosmetic"
sdk_version       = ">=3.0,<4"
loader_flags      = ["RSMM_ENABLE_HERO_CAPTURE"]

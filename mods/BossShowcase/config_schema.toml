# Per chapter boss: a Control switch, then how many attacks it draws per
# cycle and a weight per attack. Defaults change nothing.

# Chapter 1 - Tentacle Master (Dark Hills)
[fields.tentacle]
type    = "bool"
default = false
label   = "Tentacle Master: control its attacks"

[fields.tentacle_draws]
type    = "int"
default = 1
min     = 1
max     = 6
label   = "Tentacle Master: attacks drawn per cycle (how many weights are above 0)"

[fields.tentacle_doubleslam]
type    = "int"
default = 1
min     = 0
max     = 10
label   = "Tentacle Master: DoubleSlam weight (0 = never)"

[fields.tentacle_attraction]
type    = "int"
default = 1
min     = 0
max     = 10
label   = "Tentacle Master: Attraction weight (0 = never)"

[fields.tentacle_rain]

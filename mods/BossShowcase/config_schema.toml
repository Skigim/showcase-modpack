max     = 10
label   = "Tentacle Master: Rain weight (0 = never)"

[fields.tentacle_shockwave]
type    = "int"
default = 1
min     = 0
max     = 10
label   = "Tentacle Master: Shockwave weight (0 = never)"

[fields.tentacle_thorns]
type    = "int"
default = 1
min     = 0
max     = 10
label   = "Tentacle Master: Thorns weight (0 = never)"

[fields.tentacle_fastslam]
